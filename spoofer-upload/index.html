<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- viewport-fit=cover + the safe-area paddings below keep the sticky bar clear of
     the iPhone home indicator. maximum-scale is deliberately NOT set: pinch-zoom on
     a result photo is how you check the spoof actually looks clean. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#08090b" />
<meta name="color-scheme" content="dark" />
<meta name="robots" content="noindex, nofollow" />
<!-- Add to Home Screen: opens chromeless, like an app -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<meta name="apple-mobile-web-app-title" content="Spoofer" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<title>Spoofer</title>
<style>
  :root {
    --bg: #08090b;
    --bg-soft: #0d0e11;
    --panel: #111216;
    --panel-2: #16181d;
    --text: #eef0f3;
    --text-dim: #7a8290;
    --text-dimmer: #5a6270;
    --accent: #5b9dff;
    --accent-hover: #7aaeff;
    --accent-glow: rgba(91, 157, 255, 0.16);
    --reddit-orange: #ff4500;
    --reddit-orange-glow: rgba(255, 95, 30, 0.18);
    --success: #4ade80;
    --error: #f87171;
    --border: rgba(255,255,255,0.06);
    --border-strong: rgba(255,255,255,0.1);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(ellipse 70% 40% at 50% -10%, rgba(255, 95, 30, 0.10), transparent 70%),
      radial-gradient(ellipse 60% 35% at 50% -8%, rgba(255, 130, 60, 0.05), transparent 70%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 64px 20px 80px;
    font-size: 13px;
    letter-spacing: -0.005em;
  }
  .container {
    max-width: 560px;
    margin: 0 auto;
  }
  /* Mobile: tighter page padding + roomier tap targets */
  @media (max-width: 560px) {
    body { padding: 28px 14px 60px; font-size: 14px; }
    .container { max-width: 100%; }
    .primary, .secondary, .device-btn { min-height: 44px; }
    .dropzone { padding: 44px 14px; }
  }
  h1 {
    font-size: 22px;
    margin-bottom: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, #ffffff 0%, #ffd8b8 60%, #ff7a3d 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    width: fit-content;
  }
  .subtitle {
    color: var(--text-dim);
    margin-bottom: 14px;
    font-size: 12px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
  }
  .device-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .device-btn:hover { border-color: var(--accent); }
  .device-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .dropzone {
    border: 1.5px dashed var(--border-strong);
    border-radius: 12px;
    padding: 36px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
    background: var(--panel);
    margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--accent);
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
  }
  .dropzone-icon {
    font-size: 28px;
    margin-bottom: 8px;
    opacity: 0.9;
  }
  .dropzone-text {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .dropzone-hint {
    font-size: 11px;
    color: var(--text-dimmer);
    margin-top: 4px;
    letter-spacing: 0.02em;
  }
  input[type="file"] { display: none; }
  .label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 3px;
    background: var(--panel-2);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s;
    width: 0%;
  }
  .status {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px;
    margin-top: 10px;
  }
  .result-item {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    font-size: 11px;
    position: relative;
    cursor: pointer;
    transition: all 0.15s;
  }
  .result-item:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .result-item:hover .download-overlay { opacity: 1; }
  .result-item img {
    width: 100%;
    height: 80px;
    object-fit: cover;
    display: block;
  }
  .download-overlay {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 80px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
  }
  .corner-actions {
    position: absolute;
    top: 4px; right: 4px;
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 2;
  }
  .result-item:hover .corner-actions { opacity: 1; }
  .corner-btn {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
  }
  .corner-btn:hover { background: var(--accent); }
  /* Top-left delete button variant */
  .corner-actions-left {
    left: 4px;
    right: auto;
  }
  .corner-btn-delete:hover { background: var(--error) !important; }
  .copy-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--success);
    color: #0b1418;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 100;
  }
  .copy-toast.show { opacity: 1; }
  .copy-toast.error { background: var(--error); color: #fff; }
  #imgGenPreview img {
    max-width: 100%;
    margin-top: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .result-item .name {
    padding: 5px 8px 2px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--text);
    word-break: break-all;
    font-size: 10px;
  }
  .result-item .meta {
    padding: 0 8px 5px;
    color: var(--text-dim);
    font-size: 9px;
  }
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  button.primary {
    background: linear-gradient(180deg, #ff6024 0%, #ff4500 100%);
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    flex: 1;
    transition: background 0.15s ease, transform 0.05s ease, box-shadow 0.15s ease;
    box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 1px 3px rgba(255, 69, 0, 0.25);
    letter-spacing: -0.01em;
  }
  button.primary:hover:not(:disabled) {
    background: linear-gradient(180deg, #ff7340 0%, #ff5722 100%);
    box-shadow: 0 0 0 4px var(--reddit-orange-glow), 0 1px 0 rgba(255,255,255,0.2) inset, 0 2px 8px rgba(255, 69, 0, 0.3);
  }
  button.primary:active:not(:disabled) { transform: translateY(1px); }
  button.primary:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    letter-spacing: -0.01em;
  }
  button.secondary:hover { border-color: var(--border-strong); background: #1c1f25; }
  .error { color: var(--error); }
  .success { color: var(--success); }
  .progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 6px;
  }
  .progress-row .status { margin-top: 0; flex: 1; }
  .cancel-btn {
    background: transparent;
    color: var(--error);
    border: 1px solid var(--error);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  .cancel-btn:hover { background: var(--error); color: #fff; }
  /* Animated shimmer on progress fill */
  .progress-fill {
    position: relative;
    overflow: hidden;
  }
  .progress-fill::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.35) 50%, transparent 100%);
    transform: translateX(-100%);
    animation: shimmer 1.4s linear infinite;
  }
  @keyframes shimmer {
    100% { transform: translateX(100%); }
  }
  /* Result thumbnail hover zoom */
  .result-item {
    transform-origin: center;
  }
  .result-item img {
    transition: transform 0.25s ease;
  }
  .result-item:hover img {
    transform: scale(1.04);
  }
  /* Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 40px;
    cursor: zoom-out;
  }
  .lightbox.show {
    display: flex;
    animation: lightbox-in 0.18s ease-out;
  }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    object-fit: contain;
  }
  .lightbox-close {
    position: absolute;
    top: 20px; right: 24px;
    color: #fff;
    font-size: 26px;
    cursor: pointer;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.18); }
  @keyframes lightbox-in {
    from { opacity: 0; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1); }
  }
  @media (max-width: 520px) {
  }
  .at-btn.loading {
    border-color: var(--reddit-orange);
    background: linear-gradient(90deg, var(--panel-2), rgba(255,69,0,0.15), var(--panel-2));
    background-size: 200% 100%;
    animation: at-loading 1.2s linear infinite;
  }
  @keyframes at-loading {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

/* ==================================================================
   Two things on the page: the field you drop photos into, and the
   spoofed photos that come back. Everything the engine still needs to
   read (device profile, mode, toggles) lives in a hidden block and is
   fixed at a sensible default in JS.
   ================================================================== */
* { -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior-y: contain; background: var(--bg); }
body { font-size: 16px; padding: 0; }
.container {
  max-width: 640px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 16px) 14px
           calc(env(safe-area-inset-bottom) + 104px) 14px;
}
h1, .m-foot { display: none; }
#cfg { display: none !important; }

/* ---- the spoof field ---- */
.dropzone {
  padding: 0 18px; min-height: 168px;
  border-radius: 20px;
  border: 2px dashed #2e323c; background: var(--panel);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: border-color .15s, background .15s;
}
.dropzone:active, .dropzone.dragover { border-color: var(--reddit-orange); background: #16181d; }
.dropzone-icon { font-size: 44px; line-height: 1; margin-bottom: 10px; }
.dropzone-text { font-size: 17px; font-weight: 650; }
.dropzone-hint { display: none; }

/* ---- status: one quiet line, only while working ---- */
#progressPanel {
  background: none !important; border: none !important;
  padding: 0 !important; margin: 14px 0 0 !important;
}
#progressPanel .label, #progressPanel .progress-bar { display: none; }
.progress-row { display: flex; align-items: center; gap: 10px; }
.status { font-size: 13px; color: var(--text-dim); flex: 1; text-align: center; }
.cancel-btn { min-height: 38px; padding: 8px 14px; font-size: 13px; flex: none; }

/* ---- the spoofed photos ---- */
.results { grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.result-item { border-radius: 14px; }
/* The inherited rule was a fixed 80px-tall thumbnail with object-fit:cover, which
   turned every portrait phone photo into a cropped letterbox strip. Show the photo. */
.result-item img { border-radius: 14px; height: auto !important; object-fit: contain !important; }
.result-item:hover img { transform: none; }
.download-overlay { display: none !important; }
.result-item .name, .result-item .meta { display: none !important; }  /* filename/device noise */
.corner-btn-delete { display: none !important; }
.corner-actions { opacity: 1 !important; top: 8px; right: 8px; }
.corner-btn {
  width: 40px; height: 40px; font-size: 17px; border-radius: 11px;
  background: rgba(8,9,11,.82) !important; backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,.16);
}
.corner-btn:active { background: var(--reddit-orange) !important; }

/* ---- one action, thumb height ---- */
#resultsContainer .actions {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  margin: 0; padding: 12px 14px calc(env(safe-area-inset-bottom) + 12px);
  background: rgba(8,9,11,.93); backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
}
/* Save takes the bar; Reset is the small quiet one beside it. */
#resultsContainer .actions { display: flex; gap: 10px; align-items: stretch; }
#resultsContainer .actions button { min-height: 52px; font-size: 16px; font-weight: 700; border-radius: 14px; }
#downloadAllBtn { flex: 1 1 auto; }
#clearBtn {
  display: block !important;
  flex: 0 0 92px;
  font-size: 15px; font-weight: 600;
  color: var(--text-dim);
  background: var(--panel-2);
  border: 1px solid var(--border);
}
#clearBtn:active { background: #1f2229; color: var(--text); }
.copy-toast { bottom: calc(env(safe-area-inset-bottom) + 90px); font-size: 13px; }
button { touch-action: manipulation; }
@media (min-width: 660px) {
  #resultsContainer .actions { max-width: 640px; left: 50%; transform: translateX(-50%); border-radius: 16px 16px 0 0; }
}

/* ==================== Advanced settings ==================== */
.advanced-toggle {
  width: 100%; display: flex; align-items: center; gap: 10px;
  background: transparent; border: none; color: var(--text-dim);
  font: inherit; font-size: 15px; font-weight: 600; padding: 12px 4px; margin: 2px 0 8px;
  cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent;
}
.advanced-toggle #advancedChevron { color: var(--accent); font-size: 12px; transition: transform .15s; display: inline-block; }
.advanced-toggle[aria-expanded="true"] #advancedChevron { transform: rotate(90deg); }
#advancedPanel .panel { padding: 18px 16px; }
#advancedPanel .label { font-size: 12px; margin-bottom: 12px; }
.device-picker { display: flex; flex-wrap: wrap; gap: 10px; }
.device-picker .device-btn {
  min-height: 44px; padding: 10px 16px; border-radius: 10px; font-size: 15px;
  background: var(--panel-2); border: 1px solid var(--border-strong); color: var(--text);
}
.device-picker .device-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.tracker-info { margin-top: 12px; font-size: 14px; color: var(--text-dim); }
.toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.toggle-row { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--text); min-height: 32px; cursor: pointer; }
.toggle-row input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin: 0; }
.copies-row { display: flex; align-items: center; gap: 12px; }
.copies-row input {
  width: 76px; height: 44px; font-size: 16px; text-align: center;
  background: var(--panel-2); color: var(--text); border: 1px solid var(--border-strong); border-radius: 10px;
}
.copies-hint { font-size: 13px; color: var(--text-dim); }
@media (max-width: 420px) { .toggle-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">

  <!-- 1. the spoof field -->
  <div class="dropzone" id="dropzone">
    <div class="dropzone-text">Tap to spoof photos</div>
    <div class="dropzone-hint"></div>
    <input type="file" id="fileInput"
           accept="image/jpeg,image/png,image/webp,image/heic,image/heif,video/mp4,video/quicktime,video/webm,.heic,.heif,.mov,.mp4,.webm,.zip"
           multiple />
  </div>

  <div class="panel" id="progressPanel" style="display:none">
    <div class="label"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-row">
      <div class="status" id="status"></div>
      <button class="cancel-btn" id="cancelBtn" style="display:none">Stop</button>
    </div>
  </div>

  <!-- 2. the spoofed photos -->
  <div id="resultsContainer" style="display:none">
    <div class="results" id="results"></div>
    <div class="actions">
      <button class="primary" id="downloadAllBtn">Download ZIP</button>
      <button class="secondary" id="clearBtn" type="button">Reset</button>
    </div>
  </div>

  <!-- 3. advanced settings (collapsed by default) -->
  <button class="advanced-toggle" id="advancedToggle" aria-expanded="false" type="button">
    <span id="advancedChevron">▶</span> Advanced settings
  </button>
  <div id="advancedPanel" hidden>
    <div class="panel">
      <div class="label">Device profile</div>
      <div class="device-picker" id="devicePicker"></div>
      <div class="tracker-info" id="trackerInfo"></div>
    </div>
    <div class="panel">
      <div class="label">Spoof strength</div>
      <div class="device-picker" id="modePicker">
        <button class="device-btn" data-mode="hf" type="button">🪶 Normal (visually safer)</button>
        <button class="device-btn" data-mode="boosted" type="button">💪 Boosted (more aggressive)</button>
      </div>
    </div>
    <div class="panel">
      <div class="toggle-grid">
        <label class="toggle-row"><input type="checkbox" id="autoZip" /><span>⬇️ Auto-download (each file as it finishes)</span></label>
        <label class="toggle-row"><input type="checkbox" id="mirrorToggle" /><span>🪞 Mirror</span></label>
        <label class="toggle-row"><input type="checkbox" id="rotateDevices" /><span>🔄 Rotate iPhones</span></label>
      </div>
    </div>
    <div class="panel">
      <div class="label">Variations per image</div>
      <div class="copies-row">
        <input id="copiesSelect" type="number" min="1" max="10" value="1" inputmode="numeric" />
        <span class="copies-hint">1–10 — each variation is a fresh randomized spoof</span>
      </div>
    </div>
  </div>

  <div class="m-foot"></div>
  <div class="copy-toast" id="copyToast"></div>
</div>

<script>/* piexifjs 1.0.6 — inlined for offline use */

function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function randFloat(a, b) { return Math.random() * (b - a) + a; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function loadUsedFilenames() {
  try { return new Set(JSON.parse(localStorage.getItem(TRACKER_KEY) || '[]')); }
  catch { return new Set(); }
}
function saveUsedFilenames(set) {
  try { localStorage.setItem(TRACKER_KEY, JSON.stringify([...set])); } catch {}

  for (let i = 0; i < 200; i++) {

    const name = `IMG_${n}.JPG`;
    if (!used.has(name)) {
      used.add(name); saveUsedFilenames(used); return name;
    }
  }
  for (let n = 1; n <= 9999; n++) {
    const name = `IMG_${String(n).padStart(4, '0')}.JPG`;
    if (!used.has(name)) { used.add(name); saveUsedFilenames(used); return name; }
  }
  return `IMG_${String(randInt(1, 9999)).padStart(4, '0')}.JPG`;
}

function updateTrackerInfo() {
  const used = loadUsedFilenames();
  document.getElementById('trackerInfo').textContent =
    `Unique filenames used: ${used.size}/9999`;
}

// ==================== EXIF (matches piexif in Python) ====================
const TZ_OFFSETS = ['+05:30', '+09:00', '+01:00', '+02:00', '-05:00', '-08:00', '+08:00'];

function setIf(target, ifdName, tagKey, value) {
  // Defensive: only set if tagKey is a real number AND piexifjs knows the tag.
  // Skips tags the library doesn't recognize (e.g., OffsetTime on older builds).
  if (typeof tagKey !== 'number') return;
  if (!piexif.TAGS || !piexif.TAGS[ifdName] || !piexif.TAGS[ifdName][tagKey]) return;
  target[tagKey] = value;
}

function generateExif(profile) {
  const daysBack = randInt(0, 400);
  const d = new Date(Date.now() - daysBack * 86400000);
  d.setHours(randInt(0, 23), randInt(0, 59), randInt(0, 59), randInt(0, 999));

  const pad = (n, w = 2) => String(n).padStart(w, '0');
  const dateStr = `${d.getFullYear()}:${pad(d.getMonth() + 1)}:${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  const subsec = pad(d.getMilliseconds(), 3);
  const tz = pick(TZ_OFFSETS);
  const sw = pick(profile.softwares);
  const iso = randInt(profile.isoRange[0], profile.isoRange[1]);

  // Realistic exposure 1/30 to 1/1000
  const expDen = randInt(30, 1000);

  const zeroth = {};
  setIf(zeroth, 'Image', piexif.ImageIFD.Make, profile.make);
  setIf(zeroth, 'Image', piexif.ImageIFD.Model, profile.model);
  setIf(zeroth, 'Image', piexif.ImageIFD.Software, sw);
  setIf(zeroth, 'Image', piexif.ImageIFD.DateTime, dateStr);
  setIf(zeroth, 'Image', piexif.ImageIFD.Orientation, 1);
  setIf(zeroth, 'Image', piexif.ImageIFD.XResolution, [72, 1]);
  setIf(zeroth, 'Image', piexif.ImageIFD.YResolution, [72, 1]);
  setIf(zeroth, 'Image', piexif.ImageIFD.ResolutionUnit, 2);

  const exif = {};
  setIf(exif, 'Exif', piexif.ExifIFD.DateTimeOriginal, dateStr);
  setIf(exif, 'Exif', piexif.ExifIFD.DateTimeDigitized, dateStr);
  setIf(exif, 'Exif', piexif.ExifIFD.SubSecTime, subsec);
  setIf(exif, 'Exif', piexif.ExifIFD.SubSecTimeOriginal, subsec);
  setIf(exif, 'Exif', piexif.ExifIFD.SubSecTimeDigitized, subsec);
  setIf(exif, 'Exif', piexif.ExifIFD.OffsetTime, tz);
  setIf(exif, 'Exif', piexif.ExifIFD.OffsetTimeOriginal, tz);
  setIf(exif, 'Exif', piexif.ExifIFD.OffsetTimeDigitized, tz);
  setIf(exif, 'Exif', piexif.ExifIFD.ExposureTime, [1, expDen]);
  setIf(exif, 'Exif', piexif.ExifIFD.FNumber, profile.fNumber);
  setIf(exif, 'Exif', piexif.ExifIFD.ISOSpeedRatings, iso);
  setIf(exif, 'Exif', piexif.ExifIFD.FocalLength, profile.focalLength);
  setIf(exif, 'Exif', piexif.ExifIFD.Flash, 0x10);
  setIf(exif, 'Exif', piexif.ExifIFD.MeteringMode, 5);
  setIf(exif, 'Exif', piexif.ExifIFD.WhiteBalance, 0);
  setIf(exif, 'Exif', piexif.ExifIFD.SceneType, '\x01');
  setIf(exif, 'Exif', piexif.ExifIFD.ColorSpace, 1);
  setIf(exif, 'Exif', piexif.ExifIFD.ExifVersion, '0230');
  if (profile.lensModel) {
    setIf(exif, 'Exif', piexif.ExifIFD.LensModel, profile.lensModel);
    setIf(exif, 'Exif', piexif.ExifIFD.LensMake, profile.make);
  }

  // MakerNote intentionally not included — its absence is more realistic than empty
  // GPS intentionally omitted (matches "location services off")
  return { '0th': zeroth, 'Exif': exif, '1st': {}, 'thumbnail': null };
}

// ==================== Image pipeline (mirror of main.py) ====================
async function loadImageBitmap(file) {
  if ('createImageBitmap' in window) return await createImageBitmap(file);
  const img = new Image();
  const url = URL.createObjectURL(file);
  try {
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    return img;
  } finally { /* leave URL until after draw */ }
}

function newCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function smartDownscale(srcW, srcH) {
  const longEdge = Math.max(srcW, srcH);
  const target = randInt(1920, 2400);
  if (longEdge <= target) return { w: srcW, h: srcH };
  const scale = target / longEdge;
  return { w: Math.max(1, Math.round(srcW * scale)), h: Math.max(1, Math.round(srcH * scale)) };
}

function drawDownscaled(img) {
  const { w, h } = smartDownscale(img.width, img.height);
  const c = newCanvas(w, h);
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  // Flatten any transparency to white — phone cameras never output transparent pixels
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  return c;
}

function randomMiniCrop(canvas) {
  const cropW = randInt(0, 2);
  const cropH = randInt(0, 2);
  if (!cropW && !cropH) return canvas;
  const w = canvas.width - cropW;
  const h = canvas.height - cropH;
  const out = newCanvas(w, h);
  out.getContext('2d').drawImage(canvas, 0, 0);
  return out;
}

function applyCBCSat(canvas, colorDelta, brightDelta, contrastDelta) {
  const ctx = canvas.getContext('2d');
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const px = data.data;
  const cFactor = 1 + contrastDelta;
  const bFactor = 1 + brightDelta;
  const sFactor = 1 + colorDelta;
  for (let i = 0; i < px.length; i += 4) {
    let r = px[i], g = px[i + 1], b = px[i + 2];
    r *= bFactor; g *= bFactor; b *= bFactor;
    r = (r - 128) * cFactor + 128;
    g = (g - 128) * cFactor + 128;
    b = (b - 128) * cFactor + 128;
    const gray = 0.299 * r + 0.587 * g + 0.114 * b;
    r = gray + (r - gray) * sFactor;
    g = gray + (g - gray) * sFactor;
    b = gray + (b - gray) * sFactor;
    px[i]     = Math.max(0, Math.min(255, r));
    px[i + 1] = Math.max(0, Math.min(255, g));
    px[i + 2] = Math.max(0, Math.min(255, b));
  }
  ctx.putImageData(data, 0, 0);
  return canvas;
}

function adjustColor(canvas) {
  return applyCBCSat(
    canvas,
    (Math.random() < 0.5 ? -1 : 1) * randFloat(0.020, 0.050),
    (Math.random() < 0.5 ? -1 : 1) * randFloat(0.015, 0.040),
    (Math.random() < 0.5 ? -1 : 1) * randFloat(0.018, 0.045),
  );
}

function boostNonMirrored(canvas) {
  // Lighter extra C/B/C pass (1.5-2.5%) — was 3-5% but that caused visible color shifts.
  return applyCBCSat(
    canvas,
    (Math.random() < 0.5 ? -1 : 1) * randFloat(0.014, 0.025),
    (Math.random() < 0.5 ? -1 : 1) * randFloat(0.012, 0.022),
    (Math.random() < 0.5 ? -1 : 1) * randFloat(0.014, 0.024),
  );
}

function cropEdges(canvas) {
  const w = canvas.width, h = canvas.height;
  const ratio = randFloat(0.010, 0.025);
  const cropX = Math.round(w * ratio);
  const cropY = Math.round(h * ratio);
  const newW = w - 2 * cropX;
  const newH = h - 2 * cropY;
  const out = newCanvas(newW, newH);
  out.getContext('2d').drawImage(canvas, cropX, cropY, newW, newH, 0, 0, newW, newH);
  return out;
}

function mirrorHorizontal(canvas) {
  // Strongest pHash/dHash defeat available — every hash algorithm treats
  // the mirrored image as a different photo. Downside: text/faces visibly flip.
  const out = newCanvas(canvas.width, canvas.height);
  const ctx = out.getContext('2d');
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(canvas, 0, 0);
  return out;
}

function microRotate(canvas) {
  const w = canvas.width, h = canvas.height;
  const angleDeg = (Math.random() < 0.5 ? -1 : 1) * randFloat(0.2, 0.8);
  const rad = angleDeg * Math.PI / 180;
  const out = newCanvas(w, h);
  const ctx = out.getContext('2d');
  ctx.translate(w / 2, h / 2);
  ctx.rotate(rad);
  ctx.drawImage(canvas, -w / 2, -h / 2);
  // Crop margin to remove black corners
  const margin = Math.round(Math.max(w, h) * 0.013);
  const cropped = newCanvas(w - 2 * margin, h - 2 * margin);
  cropped.getContext('2d').drawImage(out, margin, margin, cropped.width, cropped.height, 0, 0, cropped.width, cropped.height);
  return cropped;
}

function resizeJitter(canvas) {
  const isBoosted = transformMode === 'boosted';
  // Boosted (AI verification) uses 4-6% downscale — outside SynthID's claimed ~1-3%
  // resilience window but small enough to be visually imperceptible at viewing size.
  const range = isBoosted ? [0.94, 0.96] : [0.96, 0.985];
  const w = canvas.width, h = canvas.height;
  const scale = randFloat(range[0], range[1]);
  const sw = Math.max(1, Math.round(w * scale));
  const sh = Math.max(1, Math.round(h * scale));
  const small = newCanvas(sw, sh);
  const sctx = small.getContext('2d');
  sctx.imageSmoothingQuality = 'high';
  sctx.drawImage(canvas, 0, 0, sw, sh);
  const back = newCanvas(w, h);
  const bctx = back.getContext('2d');
  bctx.imageSmoothingQuality = 'high';
  bctx.drawImage(small, 0, 0, w, h);
  return back;
}

// Mid-pipeline JPEG compression pass. JPEG quantizes DCT coefficients, which is
// the same domain SynthID/C2PA-durable watermarks live in. Even a single Q=85
// pass forces the encoder to rebuild DCT coefficients, disrupting the watermark's
// embedded bits without producing visible JPEG artifacts.
async function midJpegPass(canvas) {
  if (transformMode !== 'boosted') return canvas;
  const q = randFloat(0.85, 0.90);
  const dataUrl = canvas.toDataURL('image/jpeg', q);
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = dataUrl;
  });
  const out = newCanvas(canvas.width, canvas.height);
  out.getContext('2d').drawImage(img, 0, 0);
  return out;
}

// Chroma shift was removed — it caused visible color fringing on edges.
// We rely on midJpegPass + resizeJitter + noise to disrupt SynthID instead.
function chromaShift(canvas) {
  return canvas;
}

function warmifyColors(canvas) {
  const ctx = canvas.getContext('2d');
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const px = data.data;
  const rMul = randFloat(1.045, 1.055);
  const bMul = randFloat(0.945, 0.955);
  for (let i = 0; i < px.length; i += 4) {
    px[i]   = Math.min(255, px[i]   * rMul);
    px[i+2] = Math.min(255, px[i+2] * bMul);
  }
  ctx.putImageData(data, 0, 0);
  return canvas;
}

// Box-Muller needs a log, a sqrt and a cos per sample, and the noise loop wants
// three samples per pixel — ~12M transcendental calls on a 4 MP photo, measured as
// the single most expensive thing the spoofer does (662 ms of a 4.7 s photo, and
// 2079 ms cold). The samples are random by definition, so drawing them from a big
// precomputed table is statistically the same noise for ~13x less work (662 -> 50 ms).
const GAUSS_TABLE = (() => {
  const t = new Float32Array(65536);
  for (let i = 0; i < t.length; i++) {
    const u = 1 - Math.random(), v = Math.random();
    t[i] = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  return t;
})();

// All three colour steps in ONE pass over the pixels. They used to be three
// separate functions, each doing its own getImageData + putImageData — on a
// 2372x1779 photo that is ~17 MB copied out and back, three times over, plus three
// full traversals. The maths and the order are unchanged, and each step still
// writes through the Uint8ClampedArray, which is what does the clamping and
// rounding between steps — so the pixels come out the same.
function cbcRand(cLo, cHi, bLo, bHi, sLo, sHi) {
  const sign = () => (Math.random() < 0.5 ? -1 : 1);
  return {
    c: 1 + sign() * randFloat(cLo, cHi),
    b: 1 + sign() * randFloat(bLo, bHi),
    s: 1 + sign() * randFloat(sLo, sHi),
  };
}

function colorPass(canvas, boosted) {
  // willReadFrequently keeps the canvas CPU-backed; without it the first
  // getImageData pays a GPU readback (98 ms vs 21 ms, measured).
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const px = data.data;

  // Same ranges the old adjustColor() and boostNonMirrored() used.
  const A = cbcRand(0.018, 0.045, 0.015, 0.040, 0.020, 0.050);
  const B = boosted ? cbcRand(0.014, 0.024, 0.012, 0.022, 0.014, 0.025) : null;
  const rMul = randFloat(1.045, 1.055);   // warmify
  const bMul = randFloat(0.945, 0.955);

  // Hoisted into plain locals and written out longhand on purpose: a helper
  // closure here is called up to 8.4M times on a 4 MP photo, and inlining it by
  // hand measured 548 -> ~250 ms. Factors are read once, not per pixel.
  const aB = A.b, aC = A.c, aS = A.s;
  const hasB = !!B, bB = hasB ? B.b : 1, bC = hasB ? B.c : 1, bS = hasB ? B.s : 1;
  const n = px.length;

  for (let i = 0; i < n; i += 4) {
    // step 1 — brightness, contrast, saturation
    let r = px[i] * aB, g = px[i + 1] * aB, b = px[i + 2] * aB;
    r = (r - 128) * aC + 128;
    g = (g - 128) * aC + 128;
    b = (b - 128) * aC + 128;
    let gray = 0.299 * r + 0.587 * g + 0.114 * b;
    px[i]     = gray + (r - gray) * aS;
    px[i + 1] = gray + (g - gray) * aS;
    px[i + 2] = gray + (b - gray) * aS;

    // step 2 — the boosted-only second pass. Reads back through px so the
    // clamping and rounding happen exactly where they used to.
    if (hasB) {
      r = px[i] * bB; g = px[i + 1] * bB; b = px[i + 2] * bB;
      r = (r - 128) * bC + 128;
      g = (g - 128) * bC + 128;
      b = (b - 128) * bC + 128;
      gray = 0.299 * r + 0.587 * g + 0.114 * b;
      px[i]     = gray + (r - gray) * bS;
      px[i + 1] = gray + (g - gray) * bS;
      px[i + 2] = gray + (b - gray) * bS;
    }

    // step 3 — warmify
    px[i]     = px[i] * rMul;
    px[i + 2] = px[i + 2] * bMul;
  }
  ctx.putImageData(data, 0, 0);
  return canvas;
}

function addNoise(canvas) {
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const px = data.data;
  const isBoosted = transformMode === 'boosted';
  // Boosted (AI verification) uses slightly more noise than normal to disturb
  // the watermark signal — but tuned to be visually imperceptible.
  const sigma = isBoosted ? randFloat(2.4, 3.2) : randFloat(1.8, 2.5);
  const alpha = isBoosted ? randFloat(0.030, 0.045) : randFloat(0.020, 0.032);
  // Samples come off GAUSS_TABLE with an odd stride, so the walk visits every
  // entry before repeating and neighbouring pixels never share a value.
  let gi = (Math.random() * 65536) | 0;
  const gauss = () => GAUSS_TABLE[gi = (gi + 40503) & 65535];
  const sr = sigma * randFloat(0.85, 1.15);
  const sg = sigma * randFloat(0.85, 1.15);
  const sb = sigma * randFloat(0.85, 1.15);
  for (let i = 0; i < px.length; i += 4) {
    const nr = gauss() * sr;
    const ng = gauss() * sg;
    const nb = gauss() * sb;
    px[i]   = Math.max(0, Math.min(255, px[i]   * (1 - alpha) + (px[i]   + nr * 8) * alpha));
    px[i+1] = Math.max(0, Math.min(255, px[i+1] * (1 - alpha) + (px[i+1] + ng * 8) * alpha));
    px[i+2] = Math.max(0, Math.min(255, px[i+2] * (1 - alpha) + (px[i+2] + nb * 8) * alpha));
  }
  ctx.putImageData(data, 0, 0);
  return canvas;
}

function slightBlur(canvas) {
  // Use ctx.filter blur — small enough to be visually invisible
  const range = transformMode === 'boosted' ? [0.28, 0.45] : [0.20, 0.50];
  const out = newCanvas(canvas.width, canvas.height);
  const ctx = out.getContext('2d');
  ctx.filter = `blur(${randFloat(range[0], range[1]).toFixed(2)}px)`;
  ctx.drawImage(canvas, 0, 0);
  return out;
}

async function canvasToJpegDataURL(canvas, quality) {
  // Use sync toDataURL (more compatible with piexif insert)
  return canvas.toDataURL('image/jpeg', quality);
}

function dataURLToBlob(dataURL) {
  const [hdr, b64] = dataURL.split(',');
  const mime = hdr.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const len = bin.length;
  const u8 = new Uint8Array(len);
  for (let i = 0; i < len; i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], { type: mime });
}

async function spoofOne(file, forcedKey) {
  const img = await loadImageBitmap(file);
  let canvas = drawDownscaled(img);
  if (img.close) img.close();

  // Mirror is applied first so the rest of the distortions affect the flipped image.
  // When enabled, each image is flipped with ~30% probability so a batch/folder gets a
  // natural mix of mirrored and non-mirrored pics instead of ALL being flipped.
  if (mirrorEnabled && Math.random() < 0.3) canvas = mirrorHorizontal(canvas);
  canvas = randomMiniCrop(canvas);
  canvas = cropEdges(canvas);
  canvas = microRotate(canvas);
  canvas = resizeJitter(canvas);
  // Was adjustColor -> [geometry] -> boostNonMirrored -> warmifyColors, i.e. three
  // separate full-image passes. Now one. The colour maths moved to after the
  // geometry so the three steps sit together; both orders are equally valid
  // randomisation, and this way the pixels are only walked once.
  canvas = colorPass(canvas, transformMode === 'boosted');
  // Mid-pipeline JPEG re-encode + chroma shift: kills SynthID frequency-domain watermarks.
  // Both also help defeat C2PA "durable" pixel-level credentials.
  canvas = await midJpegPass(canvas);
  canvas = chromaShift(canvas);
  canvas = addNoise(canvas);
  canvas = slightBlur(canvas);

  // Rotate-iPhones toggle overrides the lock: each image gets a random Apple device
  // so the batch has forensic variety while every filename stays IMG_*.JPG
  let profile;
  if (rotateDevicesEnabled) {
    const apple = DEVICE_PROFILES.filter(p => p.make.toLowerCase() === 'apple');
    profile = pick(apple);
  } else if (forcedKey && forcedKey !== 'random') {
    profile = DEVICE_PROFILES.find(p => p.key === forcedKey) || pick(DEVICE_PROFILES);
  } else {
    profile = pick(DEVICE_PROFILES);
  }

  const quality = randFloat(0.89, 0.96);
  const jpegDataURL = await canvasToJpegDataURL(canvas, quality);

  // Inject EXIF — set pixel dimensions to match the actual output size for consistency
  const exifObj = generateExif(profile);
  setIf(exifObj['Exif'], 'Exif', piexif.ExifIFD.PixelXDimension, canvas.width);
  setIf(exifObj['Exif'], 'Exif', piexif.ExifIFD.PixelYDimension, canvas.height);
  const exifBytes = piexif.dump(exifObj);
  const inserted = piexif.insert(exifBytes, jpegDataURL);
  const blob = dataURLToBlob(inserted);

  const filename = uniqueFilename();
  return { blob, filename, deviceModel: profile.model, quality: Math.round(quality * 100) };
}

// ==================== UI ====================
function renderDevicePicker() {
  const container = document.getElementById('devicePicker');
  const options = [{ key: 'random', label: '🎲 Random' }];
  for (const p of DEVICE_PROFILES) {
    const icon = p.make.toLowerCase() === 'apple' ? '📱' : '🤖';
    options.push({ key: p.key, label: `${icon} ${p.model}` });
  }
  container.innerHTML = '';
  for (const o of options) {
    const btn = document.createElement('button');
    btn.className = 'device-btn' + (o.key === selectedDeviceKey ? ' active' : '');
    btn.textContent = o.label;
    btn.onclick = () => {
      selectedDeviceKey = o.key;
      localStorage.setItem('spoofer_device', o.key);
      renderDevicePicker();
    };
    container.appendChild(btn);
  }
}

function renderResults() {
  const container = document.getElementById('results');
  container.innerHTML = '';
  for (const r of processedResults) {
    if (!r.thumbUrl) r.thumbUrl = URL.createObjectURL(r.blob);
    const item = document.createElement('div');
    item.className = 'result-item';
    item.title = 'Click to view full size · ⬇ to download';
    item.onclick = () => viewOne(r);

    const img = document.createElement('img');
    img.src = r.thumbUrl;
    item.appendChild(img);

    const overlay = document.createElement('div');
    overlay.className = 'download-overlay';
    overlay.textContent = '👁 View';
    item.appendChild(overlay);

    // Corner download button (top-right)
    const actions = document.createElement('div');
    actions.className = 'corner-actions';
    const dl = document.createElement('div');
    dl.className = 'corner-btn';
    dl.title = 'Download';
    dl.textContent = '⬇';
    dl.onclick = (e) => { e.stopPropagation(); downloadOne(r); };
    actions.appendChild(dl);
    item.appendChild(actions);

    // Corner delete button (top-left)
    const delActions = document.createElement('div');
    delActions.className = 'corner-actions corner-actions-left';
    const del = document.createElement('div');
    del.className = 'corner-btn corner-btn-delete';
    del.title = 'Remove';
    del.textContent = '✕';
    del.onclick = (e) => {
      e.stopPropagation();
      const idx = processedResults.indexOf(r);
      if (idx > -1) processedResults.splice(idx, 1);
      renderResults();
    };
    delActions.appendChild(del);
    item.appendChild(delActions);

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = r.filename;
    item.appendChild(name);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `${r.deviceModel} · q=${r.quality}`;
    item.appendChild(meta);

// Copy that also works on plain http (where navigator.clipboard is blocked).
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

async function copyImageToClipboard(r) {
  // Pre-cache the PNG-blob on the result the first time so subsequent copies are instant
  if (!r.pngBlobPromise) {
    r.pngBlobPromise = (async () => {
      const bitmap = await createImageBitmap(r.blob);
      const c = document.createElement('canvas');
      c.width = bitmap.width;
      c.height = bitmap.height;
      c.getContext('2d').drawImage(bitmap, 0, 0);
      if (bitmap.close) bitmap.close();
      return new Promise((res, rej) => {
        c.toBlob(b => b ? res(b) : rej(new Error('PNG encode failed')), 'image/png');
      });
    })();
  }

  // ClipboardItem accepts a Promise as the value — this keeps clipboard.write()
  // called synchronously within the user-gesture window (required by Safari)
  if (navigator.clipboard && window.ClipboardItem) {
    try {
      await navigator.clipboard.write([
        new ClipboardItem({ 'image/png': r.pngBlobPromise })
      ]);
      showToast('📋 Copied — paste anywhere');
      return;
    } catch (e) {
      console.warn('clipboard.write blocked, trying fallback:', e);
      // fall through to manual fallback
    }
  }

  // Fallback for Safari + file:// (clipboard.write is blocked there).
  // Open the spoofed image in a new tab — user can right-click → Copy Image.
  try {
    const pngBlob = await r.pngBlobPromise;
    const url = URL.createObjectURL(pngBlob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    showToast('Browser blocked auto-copy. Image opened in new tab — right-click → Copy Image', true);
  } catch (e) {
    console.error('Copy fallback failed', e);
    showToast('Copy not available — use the ⬇ download button instead', true);
  }
}

// ==================== Folder + ZIP traversal ====================
const IMG_RX = /\.(jpe?g|png|webp|heic|heif)$/i;
const HEIC_RX = /\.(heic|heif)$/i;
const ZIP_VIDEO_RX = /\.(mp4|mov|m4v|webm|avi|mkv)$/i;

// HEIC → JPEG via server-side pillow_heif. HEIC has no browser decoder.
async function heicToJpeg(file) {
  const fd = new FormData();
  fd.append('file', file, file.name);
  const r = await fetch('/api/heic2jpeg', { method: 'POST', body: fd, credentials: 'include' });
  if (!r.ok) throw new Error(`heic2jpeg ${r.status}`);
  const blob = await r.blob();
  const newName = file.name.replace(/\.(heic|heif)$/i, '.jpg');
  return new File([blob], newName, { type: 'image/jpeg' });
}

async function traverseEntry(entry) {
  if (entry.isFile) {
    const file = await new Promise((res, rej) => entry.file(res, rej));
    return [file];
  }
  if (entry.isDirectory) {
    const reader = entry.createReader();
    let all = [];
    // readEntries returns max 100 per call — keep reading until empty
    while (true) {
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      if (!batch.length) break;
      for (const e of batch) all.push(...await traverseEntry(e));
    }
    return all;
  }
  return [];
}

async function gatherFromDataTransfer(dt) {
  // IMPORTANT: read the DataTransfer synchronously. The browser empties both
  // dt.items and dt.files the instant this handler yields (the first await), so
  // everything is snapshotted up front here.
  //
  // dt.files is the COMPLETE, reliable list of every dropped file in all
  // browsers — this is what makes a multi-select Finder drag of 4-5 photos land
  // all of them. The webkitGetAsEntry() Entry API is used ONLY to expand dropped
  // folders; relying on it for plain files was truncating multi-file drags to 1.
  const plainFiles = dt.files ? [...dt.files] : [];
  const entries = [];
  const looseFiles = [];
  const items = dt.items ? [...dt.items] : [];
  if (items.length && items[0] && items[0].webkitGetAsEntry) {
    for (const item of items) {
      if (item.kind && item.kind !== "file") continue;
      const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
      if (entry) { entries.push(entry); continue; }
      if (item.getAsFile) {
        const f = item.getAsFile();
        if (f) looseFiles.push(f);
      }
    }
  }

  // No folder was dropped -> dt.files already has every photo. Return them all
  // (no async, nothing that can truncate the list). This is the common case.
  const hasDir = entries.some(e => e && e.isDirectory);
  if (!hasDir) {
    if (plainFiles.length) return plainFiles;
    if (looseFiles.length) return looseFiles;
    const out = [];
    for (const e of entries) out.push(...await traverseEntry(e));
    return out;
  }

  // A folder was dropped -> expand every entry (all captured synchronously
  // above: file entries return themselves, directory entries are walked).
  const files = [...looseFiles];
  for (const entry of entries) files.push(...await traverseEntry(entry));
  return files;
}

async function extractZipImages(zipFile) {
  if (typeof JSZip === 'undefined') return [];
  const zip = await JSZip.loadAsync(zipFile);
  const out = [];
  for (const [name, entry] of Object.entries(zip.files)) {
    if (entry.dir) continue;
    if (name.startsWith('__MACOSX')) continue;
    if (name.split('/').pop().startsWith('._')) continue;
    const baseName = name.split('/').pop();
    if (IMG_RX.test(name)) {
      const blob = await entry.async('blob');
      if (HEIC_RX.test(baseName)) {
        try {
          const heicFile = new File([blob], baseName, { type: 'image/heic' });
          out.push(await heicToJpeg(heicFile));
        } catch (e) { console.warn('HEIC convert failed in zip:', baseName, e); }
      } else {
        out.push(new File([blob], baseName, { type: blob.type || 'image/jpeg' }));
      }
    } else if (ZIP_VIDEO_RX.test(name)) {
      const blob = await entry.async('blob');
      const ext = (baseName.match(/\.[^.]+$/) || ['.mp4'])[0].toLowerCase();
      const mime = ext === '.mov' ? 'video/quicktime' : ext === '.webm' ? 'video/webm' : 'video/mp4';
      out.push(new File([blob], baseName, { type: mime }));
    }
  }
  return out;
}

async function expandToImageFiles(rawFiles) {
  const out = [];
  for (const f of rawFiles) {
    if (/\.zip$/i.test(f.name) || f.type === 'application/zip' || f.type === 'application/x-zip-compressed') {
      try { out.push(...await extractZipImages(f)); }
      catch (e) { console.warn('ZIP extract failed:', e); }
    } else if (HEIC_RX.test(f.name) || f.type === 'image/heic' || f.type === 'image/heif') {
      try { out.push(await heicToJpeg(f)); }
      catch (e) { console.warn('HEIC convert failed:', f.name, e); }
    } else if (IMG_RX.test(f.name) || /^image\//.test(f.type)) {
      out.push(f);
    }
  }
  return out;
}

async function processFiles(files) {
  // If something is already running, cancel it and wait for it to actually stop.
  // This makes pasting a new image instantly replace the previous one instead of
  // being ignored. The current image-in-flight finishes (1-2s) then we take over.
  if (isProcessing) {
    cancelRequested = true;
    let waited = 0;
    while (isProcessing && waited < 5000) {
      await new Promise(r => setTimeout(r, 30));
      waited += 30;
    }
  }
  cancelRequested = false;
  isProcessing = true;
  try {
    let valid = await expandToImageFiles(files);
    if (!valid.length) { isProcessing = false; return; }
    // Apply "copies per image" multiplier so each source is spoofed N times with fresh randomization.
    let copies = parseInt(document.getElementById('copiesSelect')?.value || '1', 10) || 1;
    copies = Math.min(10, Math.max(1, copies));
    if (copies > 1) {
      const expanded = [];
      for (const f of valid) for (let c = 0; c < copies; c++) expanded.push(f);
      valid = expanded;
    }

    document.getElementById('progressPanel').style.display = 'block';
    const fill = document.getElementById('progressFill');
    const status = document.getElementById('status');
    const cancelBtn = document.getElementById('cancelBtn');
    fill.style.width = '0%';
    cancelRequested = false;
    cancelBtn.style.display = valid.length > 1 ? 'inline-block' : 'none';
    // Append to existing results instead of replacing — lets you build up a collection
    // across multiple pastes/drops. Clear button removes everything.
    const startCount = processedResults.length;
    renderResults();

  let done = 0;
  const errors = [];
  const startedAt = performance.now();
  for (const f of valid) {
    if (cancelRequested) break;

    const pct = Math.round((done / valid.length) * 100);
    const elapsed = (performance.now() - startedAt) / 1000;
    let etaStr = '';
    if (done > 0) {
      const perImg = elapsed / done;
      const remaining = Math.round(perImg * (valid.length - done));
      etaStr = ` · ETA ${remaining < 60 ? remaining + 's' : Math.ceil(remaining / 60) + 'm'}`;
    }
    status.innerHTML = `${pct}% — ${done + 1}/${valid.length}${etaStr}  ${f.name}` +
      (errors.length ? '<br><br>' + errors.map(e => `<span class="error">${e}</span>`).join('<br>') : '');
    try {
      const r = await spoofOne(f, selectedDeviceKey);
      processedResults.push(r);
    } catch (e) {
      console.error('Spoof failed', f.name, e);
      errors.push(`❌ ${f.name}: ${e.message || e}`);
    }
    done++;
    fill.style.width = `${(done / valid.length) * 100}%`;
    renderResults();
    updateTrackerInfo();
  }
  cancelBtn.style.display = 'none';

  const wasCancelled = cancelRequested;
  const addedNow = processedResults.length - startCount;
  const totalNow = processedResults.length;
  const summaryIcon = wasCancelled ? '⛔' : (addedNow === valid.length ? '✅' : '⚠️');
  const totalSuffix = totalNow > addedNow ? ` (${totalNow} total)` : '';
  const summaryText = wasCancelled
    ? `Cancelled — ${addedNow}/${valid.length} added${totalSuffix}`
    : `Done — ${addedNow}/${valid.length} spoofed${totalSuffix}`;
  status.innerHTML = `<span class="${addedNow && !wasCancelled ? 'success' : 'error'}">${summaryText}</span>` +
    (errors.length ? '<br><br>' + errors.map(e => `<span class="error">${e}</span>`).join('<br>') : '');

  // Sound notification
  if (soundEnabled && !wasCancelled) playDoneSound();

  // Nothing is saved automatically. The photos just appear below and you
  // pick when to hand them to the share sheet.
  } finally {
    isProcessing = false;
    // Reset the file input so picking the SAME file again still triggers onchange
    const fi = document.getElementById('fileInput');
    if (fi) fi.value = '';
  }
}

// Pleasant short two-tone "ding" — no audio file needed
function playDoneSound() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const now = ctx.currentTime;
    [880, 1320].forEach((freq, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, now + i * 0.12);
      g.gain.exponentialRampToValueAtTime(0.18, now + i * 0.12 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.12 + 0.28);
      o.connect(g).connect(ctx.destination);
      o.start(now + i * 0.12);
      o.stop(now + i * 0.12 + 0.30);
    });
    setTimeout(() => ctx.close(), 800);
  } catch (e) { /* sound is non-essential */ }
}

// Split dropped files: videos go to the server-side video spoofer, everything
// else (images/zip/folders) goes to the in-browser image spoofer.
const VIDEO_RX = /\.(mp4|mov|m4v|webm|avi|mkv)$/i;
function isVideo(f) { return (f.type && f.type.startsWith('video/')) || VIDEO_RX.test(f.name || ''); }
function isZip(f) { return /\.zip$/i.test(f.name || '') || f.type === 'application/zip' || f.type === 'application/x-zip-compressed'; }
async function intake(files) {
  let arr = [...files];
  // Pre-expand any zips so videos inside go to the video pipeline too.
  const zips = arr.filter(isZip);
  if (zips.length) {
    arr = arr.filter(f => !isZip(f));
    for (const z of zips) {
      try { arr.push(...await extractZipImages(z)); }
      catch (e) { console.warn('zip pre-expand failed:', e); }
    }
  }
  const videos = arr.filter(isVideo);
  const rest = arr.filter(f => !isVideo(f));
  // Sequential + awaited: images first, then videos. Prevents status-message races
  // and ensures the GIF push happens before any caller declares done.
  if (rest.length) await processFiles(rest);
  if (videos.length) await processVideos(videos);
}

// ==================== Video spoofer (server-side ffmpeg) ====================
// Unique iPhone-style name per video (IMG_XXXX.mp4), no repeats — shares the
// same used-name tracker as the image spoofer.
function videoFilename() {
  const used = loadUsedFilenames();
  for (let i = 0; i < 200; i++) {
    const n = String(randInt(1, 9999)).padStart(4, '0');
    const name = `IMG_${n}.gif`;
    if (!used.has(name)) { used.add(name); saveUsedFilenames(used); return name; }
  }
  return `IMG_${String(randInt(1, 9999)).padStart(4, '0')}.gif`;
}

async function spoofOneVideo(file) {
  const fd = new FormData();
  fd.append('video', file, file.name || 'clip.mp4');
  const mirror = document.getElementById('mirrorToggle').checked ? '1' : '0';
  const res = await fetch(`/api/spoofvideo?mode=${encodeURIComponent(transformMode)}&mirror=${mirror}&out=gif`, {
    method: 'POST', body: fd,
  });
  if (!res.ok) throw new Error(`Video ${res.status}: ${(await res.text()).slice(0, 200)}`);
  return await res.blob();
}

async function processVideos(videos) {
  const panel = document.getElementById('progressPanel');
  const status = document.getElementById('status');
  const fill = document.getElementById('progressFill');
  panel.style.display = 'block';
  const out = [];
  for (let i = 0; i < videos.length; i++) {
    const v = videos[i];
    fill.style.width = `${Math.round((i / videos.length) * 100)}%`;
    // Live "still working" indicator — video spoofing runs server-side ffmpeg
    // and takes 15-40s per clip, so without this users think the run finished.
    const t0 = Date.now();
    const tick = () => {
      const secs = Math.floor((Date.now() - t0) / 1000);
      status.innerHTML = `<span class="success">🎬 Spoofing video ${i + 1}/${videos.length} — ${v.name} · ${secs}s elapsed · usually 15-40s, keep this tab open</span>`;
    };
    tick();
    const ticker = setInterval(tick, 1000);
    try {
      const blob = await spoofOneVideo(v);
      out.push({ blob, filename: videoFilename() });
    } catch (e) {
      clearInterval(ticker);
      status.innerHTML = `<span class="error">❌ ${e.message}</span>`;
      return;
    }
    clearInterval(ticker);
  }
  fill.style.width = '100%';
  status.innerHTML = `<span class="success">✅ ${out.length} GIF(s) created</span>`;

  // Add GIFs to the results grid so they're visible + included in "Download all as ZIP".
  for (const o of out) {
    processedResults.push({
      blob: o.blob,
      filename: o.filename,
      deviceModel: 'GIF',
      quality: '—',
    });
  }
  renderResults();

  // Same for videos: they show up in the grid and wait to be saved.
}

// Updates the #status element with stage-aware messages based on % done.
(function progressContext() {
  const fill = document.getElementById('progressFill');
  const status = document.getElementById('status');
  if (!fill || !status) return;
  let lastStage = '';
  const stages = [
    { max: 15, text: 'Uploading...' },
    { max: 60, text: 'Processing...' },
    { max: 90, text: 'Generating...' },
    { max: 100, text: 'Finalizing...' },
  ];
  // Observe progress fill width changes
  const observer = new MutationObserver(() => {
    const pct = parseFloat(fill.style.width) || 0;
    const stage = stages.find(s => pct <= s.max);
    if (!stage) return;
    // Only update if status text is empty or matches a previous stage we set
    const cur = status.textContent.trim();
    if (cur === '' || stages.some(s => cur.startsWith(s.text))) {
      if (stage.text !== lastStage) {
        lastStage = stage.text;
        status.textContent = `${stage.text} ${Math.round(pct)}%`;
      } else {
        status.textContent = `${stage.text} ${Math.round(pct)}%`;
      }
    }
  });
  observer.observe(fill, { attributes: true, attributeFilter: ['style'] });
})();

if (localStorage.getItem('spoofer_rotate') === null) { rotateDevicesEnabled = true; localStorage.setItem('spoofer_rotate', '1'); }
if (localStorage.getItem('spoofer_mirror') === null) { mirrorEnabled = false; localStorage.setItem('spoofer_mirror', '0'); }
if (localStorage.getItem('spoofer_device') === null) { selectedDeviceKey = 'random'; localStorage.setItem('spoofer_device', 'random'); }
(function () {
  const set = (id, on) => { const el = document.getElementById(id); if (el) el.checked = on; };
  set('rotateDevices', rotateDevicesEnabled); set('mirrorToggle', mirrorEnabled);
})();
renderDevicePicker();
renderModePicker();

// NOTE: do NOT add a click handler here. The engine already does
//   dropzone.onclick = () => fileInput.click();
// A second handler on the same element calls fileInput.click() twice per tap.
// Desktop browsers swallow the duplicate; iOS Safari treats it as re-opening the
// picker and throws away the change event, so photos are picked and never arrive.

// Bring the results into view when a batch finishes.
(function () {
  const rc = document.getElementById('resultsContainer');
  if (!rc || !window.MutationObserver) return;
  let shown = false;
  new MutationObserver(() => {
    const visible = rc.style.display !== 'none';
    if (visible && !shown) { shown = true; setTimeout(() => rc.scrollIntoView({ behavior: 'smooth', block: 'start' }), 120); }
    if (!visible) shown = false;
  }).observe(rc, { attributes: true, attributeFilter: ['style'] });
})();



// ==================== saving, the iPhone way ====================
// A ZIP is useless on a phone: iOS cannot put one into Photos without a detour
// through the Files app, and unzipping there gives you a folder, not pictures.
// So every save path here hands over the actual image FILES. The share sheet's
// "Save N Images" drops them straight into the camera roll.
async function saveFiles(items) {
  const list = (items || []).filter(Boolean);
  if (!list.length) return;
  const files = list.map(r => new File([r.blob], r.filename,
    { type: (r.blob && r.blob.type) || 'image/jpeg' }));

  if (navigator.canShare && navigator.canShare({ files })) {
    try {
      await navigator.share({ files });
      return;
    } catch (e) {
      // The user swiping the sheet away is not a failure — do not then dump
      // a pile of downloads on them.
      if (e && e.name === 'AbortError') return;
    }
  }

  // Anything without file sharing (desktop browsers) gets the files one by one,
  // spaced out because firing them together makes browsers drop most of them.
  files.forEach((f, i) => setTimeout(() => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(f);
    a.download = f.name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, i * 300));
}

// Re-point every save the UI can reach. downloadItemsAsZip stays defined but is
// no longer wired to anything.
downloadOne = (r) => saveFiles([r]);
downloadAllAsZip = () => saveFiles(processedResults);

(function () {
  const btn = document.getElementById('downloadAllBtn');
  if (!btn) return;
  btn.onclick = async () => {
    const items = (typeof processedResults !== 'undefined' ? processedResults : []).filter(Boolean);
    if (!items.length) return;
    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Zipping…';
    // Always bundle every spoofed image into ONE .zip so nothing gets dropped by
    // the browser's multi-download blocker. (Phones can open the zip via Files.)
    try { await downloadItemsAsZip(items, zipName()); }
    finally { btn.disabled = false; btn.textContent = label; }
  };
  // Keep the count on the button so it is obvious what "all" means.
  //
  // Watch #results (the photo grid) and NOT #resultsContainer: the button lives
  // inside the container, so rewriting its label there re-triggered the observer,
  // which rewrote it again — an infinite mutation loop that locked the page up the
  // moment the first photo landed. The grid does not contain the button, and the
  // no-op guard means an unchanged label never queues another record either.
  const grid = document.getElementById('results');
  if (grid && window.MutationObserver) {
    const sync = () => {
      const n = (typeof processedResults !== 'undefined' ? processedResults : []).length;
      const next = n > 1 ? ('Download ZIP (' + n + ')') : 'Download ZIP';
      if (!btn.disabled && btn.textContent !== next) btn.textContent = next;
    };
    new MutationObserver(sync).observe(grid, { childList: true });
    sync();
  }
})();

// Belt and braces: the auto-download toggle is gone from the page, so make sure
// nothing can flip it back on from a previous visit's localStorage.
localStorage.setItem('spoofer_autozip', '0');
(function () { const el = document.getElementById('autoZip'); if (el) el.checked = false; })();



// Installed-app plumbing. Registration is skipped on plain HTTP (the spoofer's
// /mobile), where service workers are not allowed — the page still works, it
// just will not open without a connection.
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
